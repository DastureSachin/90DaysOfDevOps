name: Day 44 - Artifact Between Jobs

on:
  workflow_dispatch:

jobs:

  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate file
        run: |
          echo "Hello from Job 1" > job1-output.txt
          echo "This file was generated by the first job." >> job1-output.txt

      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: job1-output
          path: job1-output.txt

  consume:
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: job1-output

      - name: Read artifact
        run: cat job1-output.txt
