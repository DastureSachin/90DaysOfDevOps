services:

  db:
    image: postgres:16-alpine
    container_name: job-tracker-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - job-tracker-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - job-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: job-tracker-api
    env_file:
      - .env
    ports:
      - "5000:5000"
    networks:
      - job-tracker-network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: job-tracker-frontend
    ports:
      - "8080:80"
    networks:
      - job-tracker-network
    depends_on:
      - backend

networks:
  job-tracker-network:

volumes:
  job-tracker-data:
